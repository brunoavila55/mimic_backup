version: '3.8'

services:
  app:
    build: .
    container_name: mimic_app
    ports:
      - "${EXTERNAL_PORT:-3000}:3000"
    environment:
      # O host aponta para o nome do serviço 'db'
      - DATABASE_URL=host=db user=postgres password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=mimic_db port=5432 sslmode=disable
      - PORT=3000
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required and must contain at least 32 characters}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - APP_ORIGIN=${APP_ORIGIN:-}
      - TZ=${TZ:-America/Sao_Paulo}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - mimic_uploads:/app/static/uploads

  db:
    image: postgres:15-alpine
    container_name: mimic_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=mimic_db
      - TZ=${TZ:-America/Sao_Paulo}
    volumes:
      - mimic_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mimic_pgdata:
  mimic_uploads:
