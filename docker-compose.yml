version: '3.8'

services:
  app:
    build: .
    container_name: mimic_app
    ports:
      - "${EXTERNAL_PORT:-3000}:3000"
    environment:
      # O host aponta para o nome do serviço 'db'
      - DATABASE_URL=host=db user=postgres password=postgres dbname=mimic_db port=5432 sslmode=disable
      - PORT=3000
      - SECRET_KEY=${SECRET_KEY:-mimic_backup_secret_key_12345678}
      - TZ=${TZ:-America/Sao_Paulo}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: mimic_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=mimic_db
      - TZ=${TZ:-America/Sao_Paulo}
    volumes:
      - mimic_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mimic_pgdata:
