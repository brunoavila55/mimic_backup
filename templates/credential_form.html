<div class="page-enter" style="max-width: 500px; margin: 0 auto;">
    <div class="page-header">
        <div class="flex items-center gap-3">
            <a href="/settings/credentials" class="btn btn-ghost btn-icon"><i class="bx bx-arrow-back"></i></a>
            <h1 class="page-title">{{ .Title }}</h1>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <form action="{{ if .Credential.ID }}/settings/credentials/save/{{ .Credential.ID }}{{ else }}/settings/credentials/save{{ end }}" method="POST">
                <div class="form-group">
                    <label class="form-label">Name</label>
                    <input type="text" name="name" class="form-input" value="{{ .Credential.Name }}" placeholder="SSH Production" required />
                    <div class="form-hint">Identifier for this credential.</div>
                </div>

                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-input" value="{{ .Credential.Username }}" placeholder="admin" required />
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-input" placeholder="{{ if .Credential.ID }}Leave blank to keep{{ else }}Access password{{ end }}" {{ if not .Credential.ID }}required{{ end }} />
                </div>

                <div class="form-group">
                    <label class="form-label">SSH Port</label>
                    <input type="number" name="port" class="form-input" value="{{ if .Credential.Port }}{{ .Credential.Port }}{{ else }}22{{ end }}" />
                </div>

                <div class="form-actions">
                    <a href="/settings/credentials" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bx bx-save"></i> Save
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
