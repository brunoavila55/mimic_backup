<div class="page-enter">
    <div class="page-header">
        <div class="flex items-center justify-between w-full">
            <div>
                <h1 class="page-title">SSH Credentials</h1>
                <p class="page-desc">Reusable credentials for accessing network equipment.</p>
            </div>
            <a href="/settings/credentials/new" class="btn btn-primary">
                <i class="bx bx-plus"></i> New Credential
            </a>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>User</th>
                            <th>Port</th>
                            <th>Created</th>
                            <th style="width: 80px;">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {{ if .Credentials }}
                        {{ range .Credentials }}
                        <tr>
                            <td style="font-weight: 600;">{{ .Name }}</td>
                            <td class="font-mono">{{ .Username }}</td>
                            <td>{{ .Port }}</td>
                            <td class="text-secondary">{{ .CreatedAt.Format "02/01/2006" }}</td>
                            <td>
                                <div class="action-group">
                                    <a href="/settings/credentials/{{ .ID }}/edit" class="action-btn" title="Edit">
                                        <i class="bx bx-edit-alt"></i>
                                    </a>
                                    <button hx-delete="/settings/credentials/{{ .ID }}"
                                            hx-confirm="Delete this credential?"
                                            hx-target="closest tr"
                                            hx-swap="outerHTML"
                                            class="action-btn danger" title="Delete">
                                        <i class="bx bx-trash"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                        {{ end }}
                        {{ else }}
                        <tr><td colspan="5" class="table-empty">No credentials registered.</td></tr>
                        {{ end }}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
