{{ define "golden_form" }}
<div class="page-enter">
    <div class="page-header">
        <div>
            <h1 class="page-title">{{ .Title }}</h1>
            <p class="page-desc">Define a baseline standard configuration to compare backups against.</p>
        </div>
        <a href="/settings?tab=golden" class="btn btn-secondary btn-sm">
            <i class="bx bx-arrow-back"></i> Back to Settings
        </a>
    </div>

    <div class="card" style="max-width: 800px;">
        <div class="card-body">
            <form action="{{ if .Config.ID }}/settings/golden/save/{{ .Config.ID }}{{ else }}/settings/golden/save{{ end }}" method="POST" class="flex flex-col" style="gap: 16px;">
                <input type="hidden" name="id" value="{{ .Config.ID }}" />

                <div class="form-row" style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 16px;">
                    <div class="form-group">
                        <label class="form-label">Golden Config Name</label>
                        <input type="text" name="name" class="form-input" value="{{ .Config.Name }}" placeholder="e.g. Default MikroTik Router" required />
                    </div>
                    <div class="form-group">
                        <label class="form-label">Vendor Filter</label>
                        <input type="text" name="vendor" class="form-input" value="{{ if .Config.Vendor }}{{ .Config.Vendor }}{{ else }}*{{ end }}" placeholder="*" required />
                        <div class="form-hint">Applies only to this vendor</div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Group Filter</label>
                        <input type="text" name="target_group" class="form-input" value="{{ if .Config.TargetGroup }}{{ .Config.TargetGroup }}{{ else }}*{{ end }}" placeholder="*" required />
                        <div class="form-hint">Applies only to this group</div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Configuration Template</label>
                    <textarea name="config_template" class="form-input font-mono" rows="15" placeholder="Paste your baseline configuration here..." required style="resize: vertical; white-space: pre;">{{ .Config.ConfigTemplate }}</textarea>
                    <div class="form-hint">The Diff Engine will compare every backup of matching nodes against this exact text.</div>
                </div>

                <div style="margin-top: 16px; display: flex; gap: 12px; align-items: center;">
                    <button type="submit" class="btn btn-primary">
                        Save Golden Config
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{{ end }}
