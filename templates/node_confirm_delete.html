<div class="page-enter">
    <div class="confirm-card card">
        <div class="card-body" style="padding: 40px;">
            <div class="confirm-icon">
                <i class="bx bx-trash"></i>
            </div>
            <h2 class="page-title" style="margin-bottom: 8px;">Delete {{ .Node.Name }}?</h2>
            <p class="confirm-text">
                This action is irreversible. All backups associated with this node will be permanently removed.
            </p>
            <div class="flex gap-3" style="justify-content: center;">
                <a href="/nodes" class="btn btn-secondary">Cancel</a>
                <form action="/nodes/{{ .Node.ID }}/delete" method="POST" style="display: inline;">
                    <button type="submit" class="btn btn-danger">
                        <i class="bx bx-trash"></i> Delete
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
