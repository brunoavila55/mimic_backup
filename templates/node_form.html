<div class="page-enter" style="max-width: 700px; margin: 0 auto;"
     x-data="{
        scheduleType: '{{ if .Node.ScheduleType }}{{ .Node.ScheduleType }}{{ else }}individual{{ end }}',
        credentialId: '{{ if .Node.CredentialID }}{{ deref .Node.CredentialID }}{{ else }}{{ end }}'
     }">
    <div class="page-header">
        <div class="flex items-center gap-3">
            <a href="/nodes" class="btn btn-ghost btn-icon"><i class="bx bx-arrow-back"></i></a>
            <h1 class="page-title">{{ .Title }}</h1>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <form action="{{ if .Node.ID }}/nodes/save/{{ .Node.ID }}{{ else }}/nodes/save{{ end }}" method="POST">

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Name</label>
                        <input type="text" name="name" class="form-input" value="{{ .Node.Name }}" placeholder="Switch-Core-01" required />
                    </div>
                    <div class="form-group">
                        <label class="form-label">Vendor</label>
                        <select name="vendor" class="form-input">
                            <option value="cisco" {{ if eq .Node.Vendor "cisco" }}selected{{ end }}>Cisco</option>
                            <option value="mikrotik" {{ if eq .Node.Vendor "mikrotik" }}selected{{ end }}>MikroTik</option>
                            <option value="huawei" {{ if eq .Node.Vendor "huawei" }}selected{{ end }}>Huawei</option>
                            <option value="juniper" {{ if eq .Node.Vendor "juniper" }}selected{{ end }}>Juniper</option>
                            <option value="ubiquiti" {{ if eq .Node.Vendor "ubiquiti" }}selected{{ end }}>Ubiquiti</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">IP Address</label>
                        <input type="text" name="ip" class="form-input font-mono" value="{{ .Node.IP }}" placeholder="192.168.1.1" required />
                    </div>
                    <div class="form-group">
                        <label class="form-label">SSH Port</label>
                        <input type="number" name="port" class="form-input" value="{{ if .Node.Port }}{{ .Node.Port }}{{ else }}22{{ end }}" />
                    </div>
                </div>

                {{ if .Credentials }}
                <div class="form-group">
                    <label class="form-label">SSH Credential</label>
                    <select name="credential_id" class="form-input" x-model="credentialId">
                        <option value="">— Use manual login/password —</option>
                        {{ range .Credentials }}
                        <option value="{{ .ID }}" {{ if $.Node.CredentialID }}{{ if eq .ID (deref $.Node.CredentialID) }}selected{{ end }}{{ end }}>{{ .Name }} ({{ .Username }}:{{ .Port }})</option>
                        {{ end }}
                    </select>
                    <div class="form-hint" x-show="credentialId">Using saved credential. Credential username and password will be used.</div>
                </div>
                {{ end }}

                <div x-show="!credentialId">
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">SSH Username</label>
                            <input type="text" name="username" class="form-input" value="{{ .Node.Username }}" placeholder="admin" />
                        </div>
                        <div class="form-group">
                            <label class="form-label">SSH Password</label>
                            <input type="password" name="password" class="form-input" placeholder="{{ if .Node.ID }}Leave blank to keep{{ else }}Access password{{ end }}" />
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Group</label>
                        <input type="text" name="group" class="form-input" value="{{ .Node.Group }}" placeholder="General" />
                    </div>
                    <div class="form-group">
                        <label class="form-label">Tags</label>
                        <input type="text" name="tags" class="form-input" value="{{ .Node.Tags }}" placeholder="core, datacenter" />
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Schedule Type</label>
                        <select name="schedule_type" class="form-input" x-model="scheduleType">
                            <option value="individual" {{ if eq .Node.ScheduleType "individual" }}selected{{ end }}>Individual</option>
                            <option value="routine" {{ if eq .Node.ScheduleType "routine" }}selected{{ end }}>Routine</option>
                        </select>
                    </div>
                    <div class="form-group" x-show="scheduleType === 'individual'">
                        <label class="form-label">Frequency (hours)</label>
                        <select name="frequency" class="form-input">
                            <option value="1" {{ if eq .Node.Frequency "1" }}selected{{ end }}>1 hour</option>
                            <option value="6" {{ if eq .Node.Frequency "6" }}selected{{ end }}>6 hours</option>
                            <option value="12" {{ if eq .Node.Frequency "12" }}selected{{ end }}>12 hours</option>
                            <option value="24" {{ if eq .Node.Frequency "24" }}selected{{ end }}>24 hours</option>
                            <option value="168" {{ if eq .Node.Frequency "168" }}selected{{ end }}>7 days</option>
                        </select>
                    </div>
                </div>

                <div x-show="scheduleType === 'individual'">
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Backup Time</label>
                            <input type="time" name="backup_hour" class="form-input" value="{{ .Node.BackupHour }}" />
                            <div class="form-hint">Preferred time for backup execution.</div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Day of the Week (if weekly)</label>
                            <select name="backup_day" class="form-input">
                                <option value="">— Any —</option>
                                <option value="0" {{ if eq .Node.BackupDay "0" }}selected{{ end }}>Monday</option>
                                <option value="1" {{ if eq .Node.BackupDay "1" }}selected{{ end }}>Tuesday</option>
                                <option value="2" {{ if eq .Node.BackupDay "2" }}selected{{ end }}>Wednesday</option>
                                <option value="3" {{ if eq .Node.BackupDay "3" }}selected{{ end }}>Thursday</option>
                                <option value="4" {{ if eq .Node.BackupDay "4" }}selected{{ end }}>Friday</option>
                                <option value="5" {{ if eq .Node.BackupDay "5" }}selected{{ end }}>Saturday</option>
                                <option value="6" {{ if eq .Node.BackupDay "6" }}selected{{ end }}>Sunday</option>
                            </select>
                        </div>
                    </div>
                </div>

                {{ if .Routines }}
                <div class="form-group" x-show="scheduleType === 'routine'">
                    <label class="form-label">Routine</label>
                    <select name="routine_id" class="form-input">
                        <option value="">— None —</option>
                        {{ range .Routines }}
                        <option value="{{ .ID }}" {{ if $.Node.RoutineID }}{{ if eq .ID (deref $.Node.RoutineID) }}selected{{ end }}{{ end }}>{{ .Name }}</option>
                        {{ end }}
                    </select>
                </div>
                {{ end }}

                <div class="form-group">
                    <label class="form-check">
                        <input type="checkbox" name="enabled" {{ if or (not .Node.ID) .Node.Enabled }}checked{{ end }} />
                        <span>Node enabled for automatic backup</span>
                    </label>
                </div>

                <div class="form-actions">
                    <a href="/nodes" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bx bx-save"></i>
                        Save
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
