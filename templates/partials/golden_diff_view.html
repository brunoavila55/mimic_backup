<div x-data="{ viewMode: 'split', hideEqual: true }">
    <!-- Modal Header -->
    <div class="flex items-center justify-between mb-4 pb-2" style="border-bottom: 1px solid var(--border-light);">
        <div>
            <h3 style="font-size: 14px; font-weight: 600; color: var(--text);">
                <i class="bx bx-check-shield" style="color: var(--warning); vertical-align: middle; margin-right: 4px;"></i> 
                Golden Config Audit: {{ .Node.Name }}
            </h3>
            <p class="text-secondary" style="font-size: 11px; margin-top: 2px;">{{ .Node.Vendor }} &mdash; <span class="font-mono">{{ .Node.IP }}</span></p>
        </div>
        <button @click="modalOpen = false" class="modal-close" title="Close">
            <i class="bx bx-x"></i>
        </button>
    </div>

    <!-- Comparison Info & Stats Bar -->
    <div class="diff-header-panel rounded mb-3" style="border: 1px solid var(--border);">
        <div class="diff-selectors flex items-center" style="gap: 16px;">
            <div>
                <span class="text-muted" style="font-size: 11px; font-weight: 600; text-transform: uppercase;">Baseline:</span>
                <span style="font-size: 13px; font-weight: 500; margin-left: 4px;">{{ .GoldenConfig.Name }}</span>
            </div>
            <i class='bx bx-right-arrow-alt text-muted'></i>
            <div>
                <span class="text-muted" style="font-size: 11px; font-weight: 600; text-transform: uppercase;">Target:</span>
                <span style="font-size: 13px; font-weight: 500; margin-left: 4px;">Backup v{{ .CurrentBackup.Version }}</span>
            </div>
        </div>

        <div class="diff-stats">
            <span id="diff-addition-badge" class="badge badge-success" style="padding: 4px 10px; font-size: 11px;">+{{ .Additions }} additions</span>
            <span id="diff-deletion-badge" class="badge badge-danger" style="padding: 4px 10px; font-size: 11px;">-{{ .Deletions }} deletions</span>
        </div>
    </div>

    <!-- Layout Toggle Bar -->
    <div class="diff-tab-container rounded mb-3 flex items-center justify-between" style="border: 1px solid var(--border); padding-right: 12px;">
        <div class="flex items-center gap-3">
            <span class="text-secondary" style="font-weight: 500;">View Mode</span>
            <div class="diff-btn-group">
                <button class="diff-tab-btn" :class="viewMode === 'split' ? 'active' : ''" @click="viewMode = 'split'">
                    <i class="bx bx-columns"></i> Side-by-Side
                </button>
                <button class="diff-tab-btn" :class="viewMode === 'unified' ? 'active' : ''" @click="viewMode = 'unified'">
                    <i class="bx bx-menu"></i> Unified (Inline)
                </button>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <label style="font-size: 11px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; color: var(--text-muted);">
                <input type="checkbox" x-model="hideEqual" style="accent-color: var(--accent);">
                Hide Unchanged Lines
            </label>
        </div>
    </div>

    <!-- Diff Rendering Area -->
    <div class="diff-view-area rounded" style="border: 1px solid var(--border);">
        <div id="diff-body-area">
            {{ template "partials/diff_body" . }}
        </div>
    </div>
</div>
