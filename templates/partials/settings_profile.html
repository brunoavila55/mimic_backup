<div>
    <h2 class="settings-section-title">My Profile</h2>
    <p class="settings-section-desc">Update your personal information and password.</p>

    <form action="/settings/profile/save" method="POST" style="max-width: 480px;">
        <div class="form-group">
            <label class="form-label">User</label>
            <input type="text" name="username" class="form-input" value="{{ .ProfileUser.Username }}" required />
        </div>

        <div class="form-group">
            <label class="form-label">E-mail</label>
            <input type="email" name="email" class="form-input" value="{{ .ProfileUser.Email }}" placeholder="your@email.com" />
        </div>

        <div class="form-group">
            <label class="form-label">New Password</label>
            <input type="password" name="password" class="form-input" placeholder="Leave blank to keep current" autocomplete="new-password" />
            <div class="form-hint">Minimum 6 characters.</div>
        </div>

        <div class="form-group" style="padding: 12px; background: var(--bg-tertiary); border-radius: var(--radius); margin-top: 20px;">
            <div class="flex items-center gap-3">
                <div style="width: 36px; height: 36px; border-radius: var(--radius); overflow: hidden; background: var(--bg-hover);">
                    <img src="https://ui-avatars.com/api/?name={{ .ProfileUser.Username }}&background=1c1f28&color=e8eaed&bold=true&size=72" alt="{{ .ProfileUser.Username }}" style="width: 100%; height: 100%;" />
                </div>
                <div>
                    <div style="font-size: 12px; font-weight: 600; color: var(--text);">{{ .ProfileUser.Username }}</div>
                    <div style="font-size: 11px; color: var(--text-muted);">{{ .ProfileUser.Role }}</div>
                </div>
            </div>
        </div>

        <div class="form-actions" style="border-top: none; margin-top: 20px;">
            <button type="submit" class="btn btn-primary">
                <i class="bx bx-save"></i> Save Profile
            </button>
        </div>
    </form>
</div>
