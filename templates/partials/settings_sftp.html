<div>
    <h2 class="settings-section-title">SFTP Storage</h2>
    <p class="settings-section-desc">Configure the SFTP server for automatic backup export.</p>

    <form action="/settings/sftp/save" method="POST">
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Host / IP</label>
                <input type="text" name="host" class="form-input font-mono" value="{{ .Sftp.Host }}" placeholder="sftp.company.com" />
            </div>
            <div class="form-group">
                <label class="form-label">Port</label>
                <input type="number" name="port" class="form-input" value="{{ .Sftp.Port }}" placeholder="22" />
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">User</label>
                <input type="text" name="username" class="form-input" value="{{ .Sftp.Username }}" placeholder="sftp_user" />
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-input" placeholder="Leave blank to keep current" />
            </div>
        </div>
        <div class="form-group">
            <label class="form-label">Remote Path</label>
            <input type="text" name="path" class="form-input font-mono" value="{{ .Sftp.Path }}" placeholder="/backups/network" />
            <div class="form-hint">Missing directories will be created automatically.</div>
        </div>

        <div class="form-row" style="margin-top: 16px; margin-bottom: 16px;">
            <div class="form-group">
                <label class="form-label" style="display: flex; align-items: center; gap: 8px;">
                    <input type="checkbox" name="enabled" {{ if .Sftp.Enabled }}checked{{ end }}> Enable Scheduled Export
                </label>
                <div class="form-hint">Only unexported updated backups will be sent.</div>
            </div>
            <div class="form-group">
                <label class="form-label">Sync Time</label>
                <input type="time" name="sync_time" class="form-input" value="{{ .Sftp.SyncTime }}" />
                <div class="form-hint">Time of day to push updated backups (HH:MM)</div>
            </div>
        </div>

        <div class="form-actions" style="border-top: none; margin-top: 16px; display: flex; gap: 12px; align-items: center;">
            <button type="submit" class="btn btn-primary">
                <i class="bx bx-save"></i> Save Settings
            </button>
            <button type="button" class="btn btn-secondary" hx-post="/settings/sftp/test" hx-include="closest form" hx-swap="none">
                <i class="bx bx-plug"></i> Test Connection & Directory
            </button>
        </div>
    </form>
</div>
