<div class="page-enter" style="max-width: 500px; margin: 0 auto;">
    <div class="page-header">
        <div class="flex items-center gap-3">
            <a href="/settings/routines" class="btn btn-ghost btn-icon"><i class="bx bx-arrow-back"></i></a>
            <h1 class="page-title">{{ .Title }}</h1>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <form action="{{ if .Routine.ID }}/settings/routines/save/{{ .Routine.ID }}{{ else }}/settings/routines/save{{ end }}" method="POST">
                <div class="form-group">
                    <label class="form-label">Name</label>
                    <input type="text" name="name" class="form-input" value="{{ .Routine.Name }}" placeholder="Daily Backup" required />
                </div>

                <div class="form-group">
                    <label class="form-label">Description</label>
                    <textarea name="description" class="form-input" placeholder="Describe the purpose of this routine...">{{ .Routine.Description }}</textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Frequency</label>
                        <select name="frequency" class="form-input">
                            <option value="1" {{ if eq .Routine.Frequency "1" }}selected{{ end }}>1 hour</option>
                            <option value="6" {{ if eq .Routine.Frequency "6" }}selected{{ end }}>6 hours</option>
                            <option value="12" {{ if eq .Routine.Frequency "12" }}selected{{ end }}>12 hours</option>
                            <option value="24" {{ if eq .Routine.Frequency "24" }}selected{{ end }}>24 hours</option>
                            <option value="168" {{ if eq .Routine.Frequency "168" }}selected{{ end }}>7 days</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Time</label>
                        <select name="backup_hour" class="form-input">
                            <option value="" {{ if not .Routine.BackupHour }}selected{{ end }}>- Select Time -</option>
                            <option value="00:00" {{ if eq .Routine.BackupHour "00:00" }}selected{{ end }}>00:00 (Midnight)</option>
                            <option value="01:00" {{ if eq .Routine.BackupHour "01:00" }}selected{{ end }}>01:00</option>
                            <option value="02:00" {{ if eq .Routine.BackupHour "02:00" }}selected{{ end }}>02:00</option>
                            <option value="03:00" {{ if eq .Routine.BackupHour "03:00" }}selected{{ end }}>03:00</option>
                            <option value="04:00" {{ if eq .Routine.BackupHour "04:00" }}selected{{ end }}>04:00</option>
                            <option value="05:00" {{ if eq .Routine.BackupHour "05:00" }}selected{{ end }}>05:00</option>
                            <option value="06:00" {{ if eq .Routine.BackupHour "06:00" }}selected{{ end }}>06:00</option>
                            <option value="07:00" {{ if eq .Routine.BackupHour "07:00" }}selected{{ end }}>07:00</option>
                            <option value="08:00" {{ if eq .Routine.BackupHour "08:00" }}selected{{ end }}>08:00</option>
                            <option value="09:00" {{ if eq .Routine.BackupHour "09:00" }}selected{{ end }}>09:00</option>
                            <option value="10:00" {{ if eq .Routine.BackupHour "10:00" }}selected{{ end }}>10:00</option>
                            <option value="11:00" {{ if eq .Routine.BackupHour "11:00" }}selected{{ end }}>11:00</option>
                            <option value="12:00" {{ if eq .Routine.BackupHour "12:00" }}selected{{ end }}>12:00 (Noon)</option>
                            <option value="13:00" {{ if eq .Routine.BackupHour "13:00" }}selected{{ end }}>13:00</option>
                            <option value="14:00" {{ if eq .Routine.BackupHour "14:00" }}selected{{ end }}>14:00</option>
                            <option value="15:00" {{ if eq .Routine.BackupHour "15:00" }}selected{{ end }}>15:00</option>
                            <option value="16:00" {{ if eq .Routine.BackupHour "16:00" }}selected{{ end }}>16:00</option>
                            <option value="17:00" {{ if eq .Routine.BackupHour "17:00" }}selected{{ end }}>17:00</option>
                            <option value="18:00" {{ if eq .Routine.BackupHour "18:00" }}selected{{ end }}>18:00</option>
                            <option value="19:00" {{ if eq .Routine.BackupHour "19:00" }}selected{{ end }}>19:00</option>
                            <option value="20:00" {{ if eq .Routine.BackupHour "20:00" }}selected{{ end }}>20:00</option>
                            <option value="21:00" {{ if eq .Routine.BackupHour "21:00" }}selected{{ end }}>21:00</option>
                            <option value="22:00" {{ if eq .Routine.BackupHour "22:00" }}selected{{ end }}>22:00</option>
                            <option value="23:00" {{ if eq .Routine.BackupHour "23:00" }}selected{{ end }}>23:00</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Day of the Week (if weekly)</label>
                    <select name="backup_day" class="form-input">
                        <option value="">- Any -</option>
                        <option value="0" {{ if eq .Routine.BackupDay "0" }}selected{{ end }}>Monday</option>
                        <option value="1" {{ if eq .Routine.BackupDay "1" }}selected{{ end }}>Tuesday</option>
                        <option value="2" {{ if eq .Routine.BackupDay "2" }}selected{{ end }}>Wednesday</option>
                        <option value="3" {{ if eq .Routine.BackupDay "3" }}selected{{ end }}>Thursday</option>
                        <option value="4" {{ if eq .Routine.BackupDay "4" }}selected{{ end }}>Friday</option>
                        <option value="5" {{ if eq .Routine.BackupDay "5" }}selected{{ end }}>Saturday</option>
                        <option value="6" {{ if eq .Routine.BackupDay "6" }}selected{{ end }}>Sunday</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-check">
                        <input type="checkbox" name="enabled" {{ if or (not .Routine.ID) .Routine.Enabled }}checked{{ end }} />
                        <span>Active routine</span>
                    </label>
                </div>

                <div class="form-actions">
                    <a href="/settings/routines" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bx bx-save"></i> Save
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
