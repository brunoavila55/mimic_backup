<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mimic | Criar Administrador</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/x-icon" href="/static/img/favicon.ico" />
    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" />
    <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">

            <div class="auth-logo">
                <img src="/static/img/logo_texto.svg" alt="Logo Mimic" style="height: 180px; width: auto;" />
            </div>

            <div class="setup-stepper">
                <div class="setup-step done">
                    <div class="setup-step-num"><i class="bx bx-check" style="font-size: 14px;"></i></div>
                    <span>Banco de Dados</span>
                </div>
                <div class="setup-divider"></div>
                <div class="setup-step active">
                    <div class="setup-step-num">2</div>
                    <span>Administrador</span>
                </div>
            </div>

            <div class="auth-form">
                <h2 class="auth-form-title">Criar Administrador</h2>
                <p class="auth-form-desc">Configure o primeiro usuário administrador do sistema.</p>

                {{ if .Error }}
                <div class="auth-error">
                    <i class="bx bx-error-circle"></i>
                    <span>{{ .Error }}</span>
                </div>
                {{ end }}

                <form action="/setup/superuser" method="POST">
                    <div class="form-group">
                        <label class="form-label">Usuário</label>
                        <input type="text" name="username" class="form-input" placeholder="admin" required autocomplete="username" />
                    </div>

                    <div class="form-group">
                        <label class="form-label">E-mail (opcional)</label>
                        <input type="email" name="email" class="form-input" placeholder="admin@empresa.com" autocomplete="email" />
                    </div>

                    <div class="form-group">
                        <label class="form-label">Senha</label>
                        <input type="password" name="password" class="form-input" placeholder="Mínimo 6 caracteres" required minlength="6" autocomplete="new-password" />
                    </div>

                    <div class="form-group">
                        <label class="form-label">Confirmar Senha</label>
                        <input type="password" name="confirm_password" class="form-input" placeholder="Repita a senha" required minlength="6" autocomplete="new-password" />
                    </div>

                    <button type="submit" class="btn btn-primary w-full" style="padding: 10px; margin-top: 8px;">
                        <i class="bx bx-user-plus"></i>
                        Criar Administrador
                    </button>
                </form>
            </div>

            <div class="auth-footer">
                Mimic Backup Systems &mdash; Configuração Inicial
            </div>
        </div>
    </div>
</body>
</html>
