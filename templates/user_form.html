<div class="page-enter" style="max-width: 500px; margin: 0 auto;">
    <div class="page-header">
        <div class="flex items-center gap-3">
            <a href="/settings/users" class="btn btn-ghost btn-icon"><i class="bx bx-arrow-back"></i></a>
            <h1 class="page-title">{{ .Title }}</h1>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <form action="{{ if .EditUser.ID }}/settings/users/save/{{ .EditUser.ID }}{{ else }}/settings/users/save{{ end }}" method="POST">
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-input" value="{{ .EditUser.Username }}" placeholder="username" required />
                </div>

                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-input" value="{{ .EditUser.Email }}" placeholder="user@company.com" />
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-input" placeholder="{{ if .EditUser.ID }}Leave blank to keep{{ else }}Access password{{ end }}" {{ if not .EditUser.ID }}required{{ end }} autocomplete="new-password" />
                </div>

                <div class="form-group">
                    <label class="form-label">Role</label>
                    <select name="role" class="form-input">
                        <option value="Administrator" {{ if eq .EditUser.Role "Administrator" }}selected{{ end }}>Administrator</option>
                        <option value="Viewer" {{ if eq .EditUser.Role "Viewer" }}selected{{ end }}>Viewer</option>
                    </select>
                    <div class="form-hint">Administrators have full access. Viewers can only view.</div>
                </div>

                <div class="form-actions">
                    <a href="/settings/users" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bx bx-save"></i> Save
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
