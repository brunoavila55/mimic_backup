<div class="page-enter" style="max-width: 500px; margin: 0 auto;">
    <div class="page-header">
        <div class="flex items-center gap-3">
            <a href="/settings/users" class="btn btn-ghost btn-icon"><i class="bx bx-arrow-back"></i></a>
            <h1 class="page-title">{{ .Title }}</h1>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <form action="{{ if .EditUser.ID }}/settings/users/save/{{ .EditUser.ID }}{{ else }}/settings/users/save{{ end }}" method="POST">
                <div class="form-group">
                    <label class="form-label">Usuário</label>
                    <input type="text" name="username" class="form-input" value="{{ .EditUser.Username }}" placeholder="nome_usuario" required />
                </div>

                <div class="form-group">
                    <label class="form-label">E-mail</label>
                    <input type="email" name="email" class="form-input" value="{{ .EditUser.Email }}" placeholder="usuario@empresa.com" />
                </div>

                <div class="form-group">
                    <label class="form-label">Senha</label>
                    <input type="password" name="password" class="form-input" placeholder="{{ if .EditUser.ID }}Deixe em branco para manter{{ else }}Senha de acesso{{ end }}" {{ if not .EditUser.ID }}required{{ end }} autocomplete="new-password" />
                </div>

                <div class="form-group">
                    <label class="form-label">Papel</label>
                    <select name="role" class="form-input">
                        <option value="Administrator" {{ if eq .EditUser.Role "Administrator" }}selected{{ end }}>Administrador</option>
                        <option value="Viewer" {{ if eq .EditUser.Role "Viewer" }}selected{{ end }}>Visualizador</option>
                    </select>
                    <div class="form-hint">Administradores têm acesso total. Visualizadores só podem consultar.</div>
                </div>

                <div class="form-actions">
                    <a href="/settings/users" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bx bx-save"></i> Salvar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
